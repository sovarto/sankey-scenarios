replicaCount: 1

image:
  repository: "" # Set via values override, e.g. harbor.sovarto.com/internal/sankey-scenarios
  pullPolicy: IfNotPresent
  # tag defaults to Chart.appVersion (set by CI)

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sankey.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
# limits:
#   cpu: 500m
#   memory: 256Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  DATABASE_URL: "" # Required — set via secret or --set

# OIDC / SSO configuration (optional)
oidc:
  issuerUrl: ""      # e.g. https://auth.example.com/realms/my-realm
  clientId: ""
  clientSecret: ""   # Leave empty for public clients
  scopes: "openid email profile"

# Reference existing secrets for sensitive env vars
envFromSecrets: []
# - secretName: sankey-scenarios-db-app
#   mapping:
#     DATABASE_URL: uri    # envVarName: secretKey

# Run database migrations as an init container before the app starts
migration:
  enabled: true

# Liveness and readiness probes
probes:
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
