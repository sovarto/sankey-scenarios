name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}
  CHART_REPO: oci://${{ vars.REGISTRY }}/${{ vars.CHART_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Container image ──────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Helm chart ──────────────────────────────────────────
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set chart version
        id: chart_version
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="0.1.0-${SHA_SHORT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml with image and version
        run: |
          cd charts/sankey-scenarios
          sed -i "s/^version:.*/version: ${{ steps.chart_version.outputs.version }}/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"sha-$(echo ${{ github.sha }} | cut -c1-7)\"/" Chart.yaml

      - name: Lint Helm chart
        run: helm lint charts/sankey-scenarios

      - name: Package Helm chart
        run: helm package charts/sankey-scenarios --destination .helm-packages

      - name: Push Helm chart to OCI registry
        if: github.event_name != 'pull_request'
        run: |
          helm push .helm-packages/sankey-scenarios-${{ steps.chart_version.outputs.version }}.tgz ${{ env.CHART_REPO }}

      # ── Update GitOps repo for ArgoCD ─────────────────────
      - name: Update image tag in platform-config
        if: github.event_name != 'pull_request'
        env:
          GITOPS_REPO: sovarto/internal-cluster-platform-config
          VALUES_PATH: apps/sankey-scenarios/values.yaml
        run: |
          IMAGE_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"

          git clone "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${GITOPS_REPO}.git" gitops-repo
          cd gitops-repo

          # Update image.tag in the values file
          sed -i "s|^\(\s*tag:\s*\).*|\1\"${IMAGE_TAG}\"|" "${VALUES_PATH}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_PATH}"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(sankey-scenarios): update image tag to ${IMAGE_TAG}"
          git push
